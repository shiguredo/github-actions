name: "Download OpenH264"
description: "Download OpenH264 library for the platform"
inputs:
  openh264_version:
    description: "OpenH264 version (e.g. 2.7.0)"
    required: true
  use-cache:
    description: "Whether to use cache for downloaded library (true/false)"
    required: false
    default: "false"
outputs:
  openh264_path:
    description: "Path to the downloaded OpenH264 library"
    value: ${{ steps.output-unix.outputs.openh264_path || steps.output-windows.outputs.openh264_path }}
  cache-hit:
    description: "Whether the cache was hit"
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Setup cache directory
      id: setup
      shell: bash
      run: |
        # キャッシュディレクトリを設定
        CACHE_DIR="${HOME}/.openh264-cache/${{ runner.os }}-${{ runner.arch }}-${{ inputs.openh264_version }}"
        echo "cache_dir=${CACHE_DIR}" >> $GITHUB_OUTPUT

        # ライブラリファイル名を決定
        case "${{ runner.os }}" in
          Linux)
            LIB_NAME="libopenh264.so"
            ;;
          macOS)
            LIB_NAME="libopenh264.dylib"
            ;;
          Windows)
            LIB_NAME="libopenh264.dll"
            ;;
          *)
            echo "Unknown OS: ${{ runner.os }}"
            exit 1
            ;;
        esac
        echo "lib_name=${LIB_NAME}" >> $GITHUB_OUTPUT
        echo "lib_path=${CACHE_DIR}/${LIB_NAME}" >> $GITHUB_OUTPUT

    - name: Cache OpenH264
      if: inputs.use-cache == 'true'
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.setup.outputs.cache_dir }}
        key: openh264-${{ runner.os }}-${{ runner.arch }}-${{ inputs.openh264_version }}

    - name: Download and setup OpenH264 (Linux/macOS)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
      id: download-linux-macos
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ inputs.openh264_version }}"
        CACHE_DIR="${{ steps.setup.outputs.cache_dir }}"
        LIB_NAME="${{ steps.setup.outputs.lib_name }}"

        # キャッシュディレクトリを作成
        mkdir -p "${CACHE_DIR}"

        # GitHub Release から URL を動的に取得
        echo "Fetching release information for v${VERSION}..."
        # gh api を使って JSON 経由で安全に取得（一度だけ取得して変数に保存）
        RELEASE_BODY=$(gh api repos/cisco/openh264/releases/tags/v${VERSION} --jq '.body' 2>/dev/null || echo "")

        if [[ -z "$RELEASE_BODY" ]]; then
          echo "Error: Failed to fetch release information for v${VERSION}"
          exit 1
        fi

        # プラットフォームごとの設定と URL 取得
        # チェックサムファイルは v2.7.0 以降が SHA256、v2.6.0 以前が MD5 のため両方に対応する
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          if [[ "${{ runner.arch }}" == "ARM64" ]]; then
            URL=$(echo "$RELEASE_BODY" | grep -E "http.*linux-arm64.*\.so\.bz2" | head -1 | tr -d '\r')
            CHECKSUM_URL=$(echo "$RELEASE_BODY" | grep -E "http.*linux-arm64.*\.so\.signed\.(md5|sha256)\.txt" | head -1 | tr -d '\r')
          else
            URL=$(echo "$RELEASE_BODY" | grep -E "http.*linux64.*\.so\.bz2" | head -1 | tr -d '\r')
            CHECKSUM_URL=$(echo "$RELEASE_BODY" | grep -E "http.*linux64.*\.so\.signed\.(md5|sha256)\.txt" | head -1 | tr -d '\r')
          fi
          TARGET="${LIB_NAME}"
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          URL=$(echo "$RELEASE_BODY" | grep -E "http.*mac-arm64.*\.dylib\.bz2" | head -1 | tr -d '\r')
          CHECKSUM_URL=$(echo "$RELEASE_BODY" | grep -E "http.*mac-arm64.*\.dylib\.signed\.(md5|sha256)\.txt" | head -1 | tr -d '\r')
          TARGET="${LIB_NAME}"
        else
          echo "Unknown OS: ${{ runner.os }}"
          exit 1
        fi

        if [[ -z "$URL" ]]; then
          echo "Error: Could not find URL for OS ${{ runner.os }} (${{ runner.arch }}) in release"
          exit 1
        fi

        echo "Downloading from: ${URL}"
        curl -LO "${URL}"

        # ファイル名を URL から取得
        FILENAME=$(basename "${URL}" .bz2)

        echo "Extracting ${FILENAME}.bz2"
        bzip2 -d "${FILENAME}.bz2"

        # チェックサム検証（展開後のファイルに対して）
        if [[ -n "$CHECKSUM_URL" ]]; then
          echo "Downloading checksum..."
          curl -LO "${CHECKSUM_URL}"
          CHECKSUM_FILE=$(basename "${CHECKSUM_URL}")

          # チェックサムファイルの形式はバージョンで異なる
          # v2.7.0 以降: "SHA256 (filename) = hash"
          # v2.6.0 以前: "MD5 (filename) = hash"
          # いずれの形式でも最終フィールドがハッシュ値になる
          EXPECTED_CHECKSUM=$(awk '{print $NF}' < "${CHECKSUM_FILE}" | tr -d '\r')
          if [[ ! "$EXPECTED_CHECKSUM" =~ ^[0-9a-f]+$ ]]; then
            echo "Error: Failed to extract expected checksum from ${CHECKSUM_FILE}"
            exit 1
          fi

          # ファイル名からチェックサムのアルゴリズムを判定する
          if [[ "${CHECKSUM_FILE}" == *.sha256.txt ]]; then
            # SHA256 の計算
            if command -v sha256sum >/dev/null 2>&1; then
              # Linux
              ACTUAL_CHECKSUM=$(sha256sum "${FILENAME}" | cut -d' ' -f1)
            elif command -v shasum >/dev/null 2>&1; then
              # macOS
              ACTUAL_CHECKSUM=$(shasum -a 256 "${FILENAME}" | cut -d' ' -f1)
            else
              echo "Error: No SHA256 command found"
              exit 1
            fi
          else
            # MD5 の計算
            if command -v md5sum >/dev/null 2>&1; then
              # Linux
              ACTUAL_CHECKSUM=$(md5sum "${FILENAME}" | cut -d' ' -f1)
            elif command -v md5 >/dev/null 2>&1; then
              # macOS
              ACTUAL_CHECKSUM=$(md5 -q "${FILENAME}")
            else
              echo "Error: No MD5 command found"
              exit 1
            fi
          fi

          if [[ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]]; then
            echo "Error: Checksum mismatch!"
            echo "Expected: $EXPECTED_CHECKSUM"
            echo "Actual: $ACTUAL_CHECKSUM"
            exit 1
          fi
          echo "Checksum verified: $ACTUAL_CHECKSUM"
        else
          echo "Warning: Checksum URL not found, skipping checksum verification"
        fi

        # キャッシュディレクトリにコピー
        cp "${FILENAME}" "${CACHE_DIR}/${TARGET}"
        echo "Library cached to: ${CACHE_DIR}/${TARGET}"

    - name: Download and setup OpenH264 (Windows)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      id: download-windows
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $VERSION = "${{ inputs.openh264_version }}"
        # bash からのパスを Windows スタイルに変換
        $CACHE_DIR_BASH = "${{ steps.setup.outputs.cache_dir }}"
        $CACHE_DIR = $CACHE_DIR_BASH -replace '^/c/', 'C:\' -replace '/', '\'
        $LIB_NAME = "${{ steps.setup.outputs.lib_name }}"

        # キャッシュディレクトリを作成
        New-Item -ItemType Directory -Force -Path $CACHE_DIR | Out-Null

        # GitHub Release から URL を動的に取得
        Write-Host "Fetching release information for v$VERSION..."
        try {
          $releaseBody = gh api repos/cisco/openh264/releases/tags/v$VERSION --jq '.body'
        } catch {
          Write-Host "Error: Failed to fetch release information for v$VERSION"
          exit 1
        }

        # Windows用のURLを取得
        # チェックサムファイルは v2.7.0 以降が SHA256、v2.6.0 以前が MD5 のため両方に対応する
        $URL = $releaseBody | Select-String -Pattern "http.*win64.*\.dll\.bz2" | Select-Object -First 1
        if ($URL) { $URL = $URL.Line.Trim() }
        $CHECKSUM_URL = $releaseBody | Select-String -Pattern "http.*win64.*\.dll\.signed\.(md5|sha256)\.txt" | Select-Object -First 1
        if ($CHECKSUM_URL) { $CHECKSUM_URL = $CHECKSUM_URL.Line.Trim() }

        if (-not $URL) {
          Write-Host "Error: Could not find Windows x64 URL in release"
          exit 1
        }

        Write-Host "Downloading from: $URL"
        $filename = Split-Path $URL -Leaf
        Invoke-WebRequest -Uri $URL -OutFile $filename

        # bz2ファイルを展開
        7z e $filename
        $dllName = $filename -replace '\.bz2$', ''

        # チェックサム検証（展開後のファイルに対して）
        if (-not $CHECKSUM_URL) {
          Write-Host "Warning: Checksum URL not found, skipping checksum verification"
        } else {
          Write-Host "Downloading checksum..."
          $checksumFile = Split-Path $CHECKSUM_URL -Leaf
          Invoke-WebRequest -Uri $CHECKSUM_URL -OutFile $checksumFile
          $checksumContent = (Get-Content $checksumFile -Raw).Trim()

          # チェックサムファイルの形式はバージョンで異なるため URL からアルゴリズムを判定する
          # v2.7.0 以降: "SHA256 (filename) = hash"
          # v2.6.0 以前: "hash *filename"
          if ($CHECKSUM_URL -match '\.sha256\.txt$') {
            # "SHA256 (filename) = hash" 形式から hash 部分を抽出
            $algorithm = "SHA256"
            $expectedChecksum = ($checksumContent -split '=')[-1].Trim().ToLower()
          } else {
            # "hash *filename" 形式から hash 部分を抽出
            $algorithm = "MD5"
            $expectedChecksum = ($checksumContent -split '\s+')[0].ToLower()
          }
          if ($expectedChecksum -notmatch '^[0-9a-f]+$') {
            Write-Host "Error: Failed to extract expected checksum from $checksumFile"
            exit 1
          }
          $actualChecksum = (Get-FileHash -Path $dllName -Algorithm $algorithm).Hash.ToLower()
          if ($expectedChecksum -ne $actualChecksum) {
            Write-Host "Error: $algorithm checksum mismatch!"
            Write-Host "Expected: $expectedChecksum"
            Write-Host "Actual: $actualChecksum"
            exit 1
          }
          Write-Host "$algorithm checksum verified: $actualChecksum"
        }

        # キャッシュディレクトリにコピー
        $destPath = Join-Path $CACHE_DIR $LIB_NAME
        Copy-Item -Path $dllName -Destination $destPath -Force
        # bash 形式のパスで表示（後続の bash ステップとの互換性のため）
        $destPathBash = "$CACHE_DIR_BASH/$LIB_NAME"
        Write-Host "Library cached to: $destPathBash"

    - name: Copy from cache to working directory
      id: copy
      shell: bash
      run: |
        CACHE_DIR="${{ steps.setup.outputs.cache_dir }}"
        LIB_NAME="${{ steps.setup.outputs.lib_name }}"
        LIB_PATH="${{ steps.setup.outputs.lib_path }}"

        # キャッシュからワーキングディレクトリにコピー
        if [[ -f "${LIB_PATH}" ]]; then
          cp "${LIB_PATH}" "./${LIB_NAME}"
          echo "Copied ${LIB_NAME} from cache to working directory"
        else
          echo "Error: Library not found in cache: ${LIB_PATH}"
          exit 1
        fi

    - name: Set output (Ubuntu/macOS)
      if: runner.os != 'Windows'
      id: output-unix
      shell: bash
      run: |
        LIB_NAME="${{ steps.setup.outputs.lib_name }}"
        OPENH264_PATH="$(pwd)/${LIB_NAME}"
        echo "OpenH264 library path: ${OPENH264_PATH}"
        echo "openh264_path=${OPENH264_PATH}" >> $GITHUB_OUTPUT

    - name: Set output (Windows)
      if: runner.os == 'Windows'
      id: output-windows
      shell: pwsh
      run: |
        $LIB_NAME = "${{ steps.setup.outputs.lib_name }}"
        $OPENH264_PATH = Join-Path (Get-Location) $LIB_NAME
        Write-Host "OpenH264 library path: $OPENH264_PATH"
        echo "openh264_path=$OPENH264_PATH" >> $env:GITHUB_OUTPUT
